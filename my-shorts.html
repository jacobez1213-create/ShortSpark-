<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Shorts · ShortSpark</title><style>body{margin:0;background:#080b12;color:#f5f7fb;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:0 auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:28px}.logo{font-size:25px;font-weight:800;color:#fff;text-decoration:none}.logo i{color:#8b7cff;font-style:normal}.btn{display:inline-block;border:0;border-radius:12px;padding:11px 16px;background:#7567ff;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.btn.alt{background:#171d2b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.card{background:#101522;border:1px solid #20283a;border-radius:18px;padding:18px}.card video{width:100%;aspect-ratio:9/16;background:#05070b;border-radius:12px;object-fit:contain}.meta{color:#9ca7bd;font-size:14px;line-height:1.5}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;padding:55px 20px;color:#9ca7bd}.error{color:#ff8585}.idea{font-weight:750;margin:12px 0 5px;line-height:1.35}</style></head><body><div class="wrap"><div class="top"><a class="logo" href="/">Short<i>Spark</i></a><a class="btn alt" href="/">Create a Short →</a></div><h1>My Shorts</h1><p class="meta">Your completed Shorts are stored in secure cloud storage, so they won't disappear when the free server restarts.</p><div id="state" class="empty">Loading your Shorts…</div><div id="grid" class="grid"></div></div><script>async function load(){const state=document.getElementById('state'),grid=document.getElementById('grid');try{const r=await fetch('/api/my-shorts',{credentials:'include',cache:'no-store'});if(r.status===401){location.href='/account?next=video';return}const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load your Shorts.');if(!d.shorts.length){state.textContent='You have no completed Shorts yet. Create your first one to see it here.';return}state.style.display='none';grid.innerHTML=d.shorts.map(s=>{const date=new Date(s.createdAt).toLocaleString();return '<article class="card"><video controls preload="metadata" src="'+s.videoUrl+'"></video><div class="idea">'+escapeHtml(s.idea)+'</div><div class="meta">'+escapeHtml(s.style)+' · '+s.durationSeconds+'s · '+date+'</div><div class="actions"><a class="btn" href="'+s.videoUrl+'" target="_blank">Open video</a><a class="btn alt" href="'+s.videoUrl+'" download>Download MP4</a><a class="btn alt" href="'+s.captionsUrl+'" download>Captions</a></div></article>'}).join('')}catch(e){state.innerHTML='<span class="error">'+escapeHtml(e.message)+'</span>'}}function escapeHtml(v){return String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}load();</script></body></html>
